name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API syntax check
        run: |
          node --check api/server.js
          node --check api/chat-routes.js
          node --check api/email-helpers.js

      - name: Production build
        run: npm run build
