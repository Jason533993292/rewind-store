  <!-- Suppress Chrome "AudioContext was not allowed to start" warning.
       Three.js creates an AudioContext eagerly on renderer init; Chrome allows
       creation but warns when .resume() is called without a gesture. This patch
       defers resume() until the first click/touch/keydown. -->
  <script>
  (function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var q=[],g=false,r=AC.prototype.resume;AC.prototype.resume=function(){if(g)return r.apply(this,arguments);var s=this;q.push(function(){r.call(s)});return Promise.resolve()};function h(){g=true;q.forEach(function(f){f()});q=[]}document.addEventListener('click',h,{once:true,capture:true});document.addEventListener('touchstart',h,{once:true,capture:true});document.addEventListener('keydown',h,{once:true,capture:true})})();
  </script>
